<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="bgNavy" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#071224" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient id="softEmeraldGlow" cx="0.5" cy="0.5" r="0.42">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <pattern id="subtleGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.06" />
    </pattern>

    <filter id="badgeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgNavy)" />
  <rect width="1200" height="750" fill="url(#softEmeraldGlow)" />
  <rect width="1200" height="750" fill="url(#subtleGrid)" />

  <!-- Remote Jobs Hub Icon Badge -->
  <g filter="url(#badgeGlow)">
    <rect x="548" y="220" width="104" height="104" rx="26" fill="#061E24" stroke="#10B981" stroke-opacity="0.4" stroke-width="2" />
    <rect x="574" y="256" width="52" height="38" rx="7" fill="none" stroke="#34D399" stroke-width="3.5" />
    <path d="M 590 256 V 248 C 590 244.5 592.5 242 596 242 H 604 C 607.5 242 610 244.5 610 248 V 256" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 574 272 H 626" stroke="#10B981" stroke-opacity="0.6" stroke-width="2.5" />
  </g>

  <!-- Remote Jobs Hub Wordmark -->
  <text x="600" y="388" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Remote Jobs </tspan>
    <tspan fill="#34D399">Hub</tspan>
  </text>

  <!-- OFFICIAL BRAND ACCOUNT Pill -->
  <rect x="410" y="424" width="380" height="48" rx="24" fill="#062229" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="444" cy="448" r="5" fill="#34D399" />
  <text x="610" y="454" text-anchor="middle" fill="#6EE7B7" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="3.2">
    OFFICIAL BRAND ACCOUNT
  </text>
</svg>
